<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--primary, #5e6ad2);stop-opacity:1" />
      <stop offset="50%" style="stop-color:var(--primary, #5e6ad2);stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:var(--primary, #5e6ad2);stop-opacity:0.7" />
    </linearGradient>

    <linearGradient id="gradientAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:var(--primary, #5e6ad2);stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:var(--primary, #5e6ad2);stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:var(--primary, #5e6ad2);stop-opacity:0.3" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer decorative ring -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="url(#gradientAccent)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="120" cy="120" r="110" fill="none" stroke="url(--primary, #5e6ad2)" stroke-width="0.5" opacity="0.3"/>

  <!-- Ganga wave patterns (top accent) -->
  <g opacity="0.4">
    <path d="M 50 60 Q 60 55 70 60 T 90 60 T 110 60 T 130 60 T 150 60 T 170 60 T 190 60"
          stroke="var(--primary, #5e6ad2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 50 68 Q 60 63 70 68 T 90 68 T 110 68 T 130 68 T 150 68 T 170 68 T 190 68"
          stroke="var(--primary, #5e6ad2)" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Main building structure with depth -->
  <g filter="url(#shadow)">
    <!-- Building shadow -->
    <path d="M 65 95 L 105 60 L 145 95 L 145 160 L 65 160 Z"
          fill="var(--primary, #5e6ad2)" opacity="0.15"/>

    <!-- Main building -->
    <path d="M 60 90 L 100 55 L 140 90 L 140 155 L 60 155 Z"
          fill="url(#gradientMain)"
          stroke="var(--primary, #5e6ad2)"
          stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- Roof peak accent -->
    <polygon points="100,55 95,75 105,75" fill="var(--primary, #5e6ad2)" opacity="0.6"/>
    <line x1="100" y1="55" x2="100" y2="75" stroke="var(--primary, #5e6ad2)" stroke-width="1.5" opacity="0.4"/>

    <!-- Ornamental door with details -->
    <rect x="92" y="125" width="16" height="25" fill="var(--primary, #5e6ad2)" rx="2"/>
    <circle cx="106" cy="137" r="2.5" fill="var(--card, white)" opacity="0.9"/>
    <rect x="92" y="125" width="16" height="25" fill="none" stroke="var(--primary, #5e6ad2)" stroke-width="1.5" rx="2" opacity="0.5"/>

    <!-- Windows - Left column -->
    <g>
      <rect x="68" y="85" width="14" height="14" fill="var(--accent, #e0f2fe)" rx="2" stroke="var(--primary, #5e6ad2)" stroke-width="1.5"/>
      <line x1="75" y1="85" x2="75" y2="99" stroke="var(--primary, #5e6ad2)" stroke-width="0.8" opacity="0.5"/>
      <line x1="68" y1="92" x2="82" y2="92" stroke="var(--primary, #5e6ad2)" stroke-width="0.8" opacity="0.5"/>
    </g>

    <g>
      <rect x="68" y="107" width="14" height="14" fill="var(--accent, #e0f2fe)" rx="2" stroke="var(--primary, #5e6ad2)" stroke-width="1.5"/>
      <line x1="75" y1="107" x2="75" y2="121" stroke="var(--primary, #5e6ad2)" stroke-width="0.8" opacity="0.5"/>
      <line x1="68" y1="114" x2="82" y2="114" stroke="var(--primary, #5e6ad2)" stroke-width="0.8" opacity="0.5"/>
    </g>

    <!-- Windows - Right column -->
    <g>
      <rect x="158" y="85" width="14" height="14" fill="var(--accent, #e0f2fe)" rx="2" stroke="var(--primary, #5e6ad2)" stroke-width="1.5"/>
      <line x1="165" y1="85" x2="165" y2="99" stroke="var(--primary, #5e6ad2)" stroke-width="0.8" opacity="0.5"/>
      <line x1="158" y1="92" x2="172" y2="92" stroke="var(--primary, #5e6ad2)" stroke-width="0.8" opacity="0.5"/>
    </g>

    <g>
      <rect x="158" y="107" width="14" height="14" fill="var(--accent, #e0f2fe)" rx="2" stroke="var(--primary, #5e6ad2)" stroke-width="1.5"/>
      <line x1="165" y1="107" x2="165" y2="121" stroke="var(--primary, #5e6ad2)" stroke-width="0.8" opacity="0.5"/>
      <line x1="158" y1="114" x2="172" y2="114" stroke="var(--primary, #5e6ad2)" stroke-width="0.8" opacity="0.5"/>
    </g>

    <!-- Center window (upper floor) -->
    <g>
      <rect x="108" y="75" width="12" height="12" fill="var(--accent, #e0f2fe)" rx="1.5" stroke="var(--primary, #5e6ad2)" stroke-width="1.2" opacity="0.8"/>
      <line x1="114" y1="75" x2="114" y2="87" stroke="var(--primary, #5e6ad2)" stroke-width="0.7" opacity="0.4"/>
      <line x1="108" y1="81" x2="120" y2="81" stroke="var(--primary, #5e6ad2)" stroke-width="0.7" opacity="0.4"/>
    </g>

    <!-- Foundation line -->
    <line x1="60" y1="155" x2="140" y2="155" stroke="var(--primary, #5e6ad2)" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Ganga river waves (bottom) - More detailed -->
  <g opacity="0.85" stroke="var(--primary, #5e6ad2)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Wave 1 -->
    <path d="M 45 165 Q 60 158 75 165 Q 90 172 105 165 Q 120 158 135 165 Q 150 172 165 165 Q 180 158 195 165"
          stroke-width="2.5"/>

    <!-- Wave 2 -->
    <path d="M 40 177 Q 55 171 70 177 Q 85 183 100 177 Q 115 171 130 177 Q 145 183 160 177 Q 175 171 190 177 Q 205 183 220 177"
          stroke-width="2" opacity="0.7"/>

    <!-- Wave 3 -->
    <path d="M 50 187 Q 65 182 80 187 Q 95 192 110 187 Q 125 182 140 187 Q 155 192 170 187 Q 185 182 200 187"
          stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Spiritual dot in center (sacred mark) -->
  <circle cx="120" cy="120" r="3" fill="var(--primary, #5e6ad2)" opacity="0.6"/>

  <!-- Decorative corner flourishes -->
  <g stroke="var(--primary, #5e6ad2)" stroke-width="1.2" fill="none" opacity="0.4">
    <!-- Top-left flourish -->
    <path d="M 50 50 Q 55 55 50 60" stroke-linecap="round"/>
    <!-- Top-right flourish -->
    <path d="M 190 50 Q 185 55 190 60" stroke-linecap="round"/>
    <!-- Bottom-left flourish -->
    <path d="M 50 200 Q 55 195 50 190" stroke-linecap="round"/>
    <!-- Bottom-right flourish -->
    <path d="M 190 200 Q 185 195 190 190" stroke-linecap="round"/>
  </g>

  <!-- Outer protective circle -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="var(--primary, #5e6ad2)" stroke-width="2" opacity="0.5"/>
</svg>
